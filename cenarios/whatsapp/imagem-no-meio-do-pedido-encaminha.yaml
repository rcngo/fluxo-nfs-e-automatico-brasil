nome: No meio do pedido (faltava o CNPJ), o cliente manda uma foto; o pedido vai ao colaborador com os dados já coletados, a legenda e a foto
dado:
  remetentes:
    - { canal: whatsapp, identificador: "+5564999990000" }
  empresa: { exige_confirmacao: false }
passos:
  - cliente: { canal: whatsapp, de: "556499990000", texto: "Preciso da nota de programação de setembro da Agro Exemplo, R$ 180,00" }
  - sistema_responde_contendo: "CNPJ ou CPF do tomador"
  - cliente: { whatsapp: imagem-com-legenda.json }
  - encaminhado_ao_colaborador:
      motivo: audio_ou_imagem
      midia: "2234567890123456"
      contendo: ["Valor: R$ 180,00", "[imagem] segue o pedido da Agro Exemplo"]
  - notas_emitidas: 0
