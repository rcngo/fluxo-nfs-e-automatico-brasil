# Instalação do escritório (produção): Postgres, n8n, motor, Caddy (HTTPS) e backup diário.
# Não é o compose de desenvolvimento (infra/docker-compose.yml, projeto nfs-poc).
#
# Primeira vez: ./instalar.sh (gera o .env e o secrets.env, sobe tudo). Guia: docs/INSTALACAO.md.
# Depois:       docker compose up -d --build   (nesta pasta)
#
# Para a internet, só o Caddy (portas 80 e 443). O editor do n8n escuta só em 127.0.0.1
# (acesso por túnel SSH); o Postgres e o motor não têm porta no servidor.

name: nfs

services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: n8n
      APP_DB: nfs
      TZ: America/Sao_Paulo
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d n8n"]
      interval: 5s
      timeout: 5s
      retries: 20

  n8n:
    # Versão fixa, a mesma do desenvolvimento. Atualizar de propósito, testando os workflows.
    image: docker.n8n.io/n8nio/n8n:2.40.5
    restart: unless-stopped
    ports:
      - "127.0.0.1:${N8N_PORTA_LOCAL:-5678}:5678"
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: "5432"
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: ${POSTGRES_USER}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      # Endereço do editor pelo túnel SSH. O n8n monta com ele o retorno do Google ao conectar o
      # Gmail, e esse retorno exige o login do editor no mesmo endereço (testado em 14/10/2026):
      # com o domínio público, a conexão falha ("Unauthorized"). O webhook do WhatsApp chega pelo
      # domínio mesmo assim (https://<domínio>/webhook/whatsapp, via Caddy); só o endereço que o
      # editor mostra no nó é que aparece como localhost.
      N8N_WEBHOOK_URL: http://localhost:${N8N_PORTA_LOCAL:-5678}/
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      GENERIC_TIMEZONE: America/Sao_Paulo
      TZ: America/Sao_Paulo
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      postgres:
        condition: service_healthy

  # Regras do fluxo (extração, decisão, emissão) e painel. O n8n chama em http://motor:3000.
  motor:
    build:
      context: ../..
      dockerfile: infra/producao/Dockerfile
    image: nfs-motor:local
    restart: unless-stopped
    env_file: ./secrets.env   # NFEIO_API_KEY, ANTHROPIC_API_KEY, WHATSAPP_APP_SECRET, WHATSAPP_VERIFY_TOKEN
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/nfs
      URL_PUBLICA: ${URL_PUBLICA}
      PASTA_DOMINIO: /app/saida/dominio
      # Emissão real: só com a decisão formal do escritório (docs/RUNBOOK.md, "Ligar a emissão real").
      EMISSAO_PRODUCAO_HABILITADA: ${EMISSAO_PRODUCAO_HABILITADA:-false}
      EMISSAO_PRODUCAO_DECISAO: ${EMISSAO_PRODUCAO_DECISAO:-}
      TZ: America/Sao_Paulo
    volumes:
      - notas:/app/saida
      - ./cadastro:/cadastro:ro   # planilhas para npm run importar (docs/INSTALACAO.md)
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/saude"]
      interval: 10s
      timeout: 5s
      retries: 10
    depends_on:
      postgres:
        condition: service_healthy

  caddy:
    image: caddy:2.10.2
    restart: unless-stopped
    ports:
      - "${HTTP_PORTA:-80}:80"
      - "${HTTPS_PORTA:-443}:443"
    environment:
      DOMINIO: ${DOMINIO}
      EMAIL_ACME: ${EMAIL_ACME}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - motor
      - n8n

  # Backup diário do banco (aplicação e n8n) e da pasta de notas, com teste de restauração
  # a cada execução. Arquivos em ./backups (copiar para fora do servidor; ver docs/INSTALACAO.md).
  backup:
    image: postgres:17
    restart: unless-stopped
    entrypoint: ["bash", "/scripts/backup.sh"]
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      BACKUP_HORA: ${BACKUP_HORA:-02:30}
      BACKUP_DIAS: ${BACKUP_DIAS:-30}
      TZ: America/Sao_Paulo
    volumes:
      - ./backup.sh:/scripts/backup.sh:ro
      - ./backups:/backups
      - notas:/notas:ro
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
  n8n_data:
  notas:
  caddy_data:
  caddy_config:
